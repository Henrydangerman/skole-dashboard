<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mit skoledashboard</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151f35;--line:#2a3857;--text:#f2f5ff;--muted:#aab6d1;--accent:#8b7cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,Arial,sans-serif}
main{max-width:950px;margin:0 auto;padding:28px 18px}
header,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}
h1{margin:0 0 5px;font-size:28px}h2{font-size:19px;margin:0 0 16px}.muted{color:var(--muted);margin:0}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
a.link{display:flex;align-items:center;gap:12px;padding:17px;border:1px solid var(--line);border-radius:14px;background:#1b2945;color:var(--text);text-decoration:none;font-weight:650}
a.link:hover{border-color:var(--accent);background:#25345a}.emoji{font-size:25px}
form{display:flex;gap:9px;flex-wrap:wrap}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid var(--line)}
input,select{background:#0d172a;color:var(--text);flex:1;min-width:140px}button{background:var(--accent);color:white;border:0;font-weight:650;cursor:pointer}
.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.task:last-child{border:0}.task span{flex:1}.task.done span{text-decoration:line-through;color:var(--muted)}
.delete{background:transparent;color:#ff9ca8;padding:5px 9px}.empty{color:var(--muted);padding:8px 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
<header>
  <h1>🎓 Mit skoledashboard</h1>
  <p class="muted">Dine skolelinks og lektier samlet ét sted.</p>
</header>
<section class="panel">
  <h2>🌐 Mine hjemmesider</h2>
  <div class="links">
    <a class="link" href="https://www.aula.dk/" target="_blank" rel="noopener noreferrer"><span class="emoji">🏫</span>Aula ↗</a>
    <a class="link" href="https://classroom.google.com/" target="_blank" rel="noopener noreferrer"><span class="emoji">📚</span>Google Classroom ↗</a>
    <a class="link" href="https://www.matematikfessor.dk/" target="_blank" rel="noopener noreferrer"><span class="emoji">➗</span>MatematikFessor ↗</a>
  </div>
</section>
<section class="panel">
  <h2>📌 Mine lektier</h2>
  <form id="taskForm">
    <input id="taskInput" placeholder="Skriv en lektie..." maxlength="120" required>
    <select id="subject"><option>Dansk</option><option>Matematik</option><option>Engelsk</option><option>Historie</option><option>Naturfag</option><option>Andet</option></select>
    <button type="submit">Tilføj</button>
  </form>
  <div id="tasks" style="margin-top:12px"></div>
</section>
<footer>Lektier gemmes lokalt i denne browser.</footer>
</main>
<script>
const KEY="school_dashboard_tasks_v2";
let tasks=[];
try{tasks=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(tasks))tasks=[]}catch(e){tasks=[]}
const list=document.getElementById("tasks");
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function render(){
 list.replaceChildren();
 if(!tasks.length){const p=document.createElement("p");p.className="empty";p.textContent="Du har ikke tilføjet lektier endnu.";list.append(p);return}
 tasks.forEach((task,index)=>{
  const row=document.createElement("div");row.className="task"+(task.done?" done":"");
  const check=document.createElement("input");check.type="checkbox";check.checked=!!task.done;check.setAttribute("aria-label","Færdig");
  check.addEventListener("change",()=>{tasks[index].done=check.checked;save();render()});
  const label=document.createElement("span");label.textContent=task.text+" · "+task.subject;
  const del=document.createElement("button");del.type="button";del.className="delete";del.textContent="Slet";
  del.addEventListener("click",()=>{tasks.splice(index,1);save();render()});
  row.append(check,label,del);list.append(row);
 });
}
document.getElementById("taskForm").addEventListener("submit",event=>{
 event.preventDefault();
 const text=document.getElementById("taskInput").value.trim();
 if(!text)return;
 tasks.push({text,subject:document.getElementById("subject").value,done:false});
 save();document.getElementById("taskInput").value="";render();
});
render();
</script>
</body>
</html>
