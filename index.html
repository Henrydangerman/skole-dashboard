<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkoleHub · Mine links</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1020;color:#f1f0ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#241c48 0%,transparent 38%),#0b1020}button,input{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:240px;background:#11162a;border-right:1px solid #2a304b;padding:28px 17px}aside h1{font-size:25px;margin:0 0 34px;color:#c4b5fd}nav button{display:block;width:100%;text-align:left;padding:14px;border:0;border-radius:12px;background:transparent;color:#aeb5d2;margin-bottom:8px}nav button.active,nav button:hover{background:#30264e;color:#fff}main{margin-left:240px;padding:38px;max-width:1400px}.muted{color:#a6afcb}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.top h2{font-size:32px;margin:5px 0 12px}.primary{background:#8b5cf6;border:0;color:white;border-radius:11px;padding:12px 17px;font-weight:600}.ghost{background:#303752;border:0;color:#e7e8f9;border-radius:9px;padding:8px 12px}.danger{background:#4b2739;border:0;color:#ffc3d1;border-radius:9px;padding:8px 12px}.panel{background:#171d34;border:1px solid #323956;border-radius:19px;padding:23px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:17px;margin-top:24px}.linkcard{background:#181f38;border:1px solid #333b5a;border-radius:18px;padding:19px;min-height:165px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s,border-color .15s}.linkcard:hover{transform:translateY(-3px);border-color:#9878fa}.linkcard a{color:inherit;text-decoration:none;display:flex;gap:13px;align-items:center;overflow-wrap:anywhere}.symbol{width:47px;height:47px;display:grid;place-items:center;border-radius:13px;background:#35275a;color:#d2c0ff;font-size:22px;flex-shrink:0}.linkcard strong{font-size:17px}.linkcard small{display:block;color:#9ca6c7;margin-top:6px;word-break:break-all}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:17px}input{width:100%;padding:12px;background:#0f1529;color:#fff;border:1px solid #444d6b;border-radius:10px;margin:7px 0 15px}label{display:block;font-weight:600}form{max-width:580px}.hidden{display:none}.empty{text-align:center;padding:55px 20px;color:#a6afcb}.tip{font-size:13px;color:#9fa8c9}.pill{padding:7px 11px;background:#30264e;color:#d7c5ff;border-radius:20px;font-size:13px}@media(max-width:750px){aside{position:static;width:auto;padding:15px}aside h1{margin:0 0 12px}nav{display:flex;gap:8px}nav button{width:auto;margin:0}main{margin:0;padding:22px}.top h2{font-size:26px}}
</style>
</head>
<body>
<aside><h1>✦ SkoleHub</h1><nav><button class="active" id="homeBtn">🏠 Mine websites</button></nav><p class="tip">Dine links gemmes lokalt i browseren.</p></aside>
<main>
<div class="top"><div><p class="muted" id="date"></p><h2>Mine skolewebsites</h2><p class="muted">Alle dine vigtigste hjemmesider samlet ét sted.</p></div><button class="primary" id="addBtn">＋ Tilføj website</button></div>
<section id="editor" class="panel hidden"><h3 id="formTitle">Tilføj website</h3><form id="form"><label for="name">Navn</label><input id="name" maxlength="80" placeholder="Fx Aula" required><label for="url">Link til hjemmesiden</label><input id="url" type="url" placeholder="https://..." required><div><button class="primary" type="submit">Gem website</button> <button class="ghost" id="cancel" type="button">Annuller</button></div></form></section>
<section id="cards" class="grid"></section>
<div class="panel"><strong>💡 Tip</strong><p class="muted">Tryk på “Tilføj website” for at samle dine skolelinks. Klik på et kort for at åbne hjemmesiden i en ny fane.</p></div>
</main>
<script>
const storageKey="skolehub-links-v1";let links=[];try{const saved=JSON.parse(localStorage.getItem(storageKey)||"[]");if(Array.isArray(saved))links=saved.filter(x=>x&&typeof x.name==="string"&&typeof x.url==="string")}catch{}let editing=null;
const el=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const valid=u=>{try{const p=new URL(u);return ["https:","http:"].includes(p.protocol)}catch{return false}};
const save=()=>localStorage.setItem(storageKey,JSON.stringify(links));
el("date").textContent=new Date().toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function render(){el("cards").innerHTML=links.length?links.map(x=>{const url=valid(x.url)?x.url:"#";let host="Website";try{host=new URL(url).hostname}catch{}return '<article class="linkcard"><a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer"><span class="symbol">↗</span><span><strong>'+esc(x.name)+'</strong><small>'+esc(host)+'</small></span></a><div class="actions"><button class="ghost" data-edit="'+esc(x.id)+'">Rediger</button><button class="danger" data-delete="'+esc(x.id)+'">Slet</button></div></article>'}).join(""):'<div class="panel empty" style="grid-column:1/-1">Du har ingen websites endnu. Tryk på “Tilføj website” for at komme i gang.</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Vil du slette dette website?")){links=links.filter(x=>x.id!==b.dataset.delete);save();render()}})}
function openEditor(id=null){editing=id;const x=links.find(x=>x.id===id);el("formTitle").textContent=x?"Rediger website":"Tilføj website";el("name").value=x?.name||"";el("url").value=x?.url||"";el("editor").classList.remove("hidden");el("name").focus()}
function closeEditor(){editing=null;el("editor").classList.add("hidden");el("form").reset()}
el("addBtn").onclick=()=>openEditor();el("cancel").onclick=closeEditor;
el("form").onsubmit=e=>{e.preventDefault();const name=el("name").value.trim();let url=el("url").value.trim();if(!valid(url)){alert("Indtast et gyldigt http- eller https-link.");return}if(!name)return;if(editing){const x=links.find(x=>x.id===editing);if(x){x.name=name;x.url=url}}else links.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,url});save();closeEditor();render()};
render();
</script>
</body></html>
