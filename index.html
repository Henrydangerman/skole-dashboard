<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkoleHub</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial;background:#0c1020;color:#e9eafa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}aside{position:fixed;inset:0 auto 0 0;width:235px;background:#11162b;border-right:1px solid #282e48;padding:24px 15px}h1{font-size:23px;margin:0 0 30px;color:#c9b6ff}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#aeb6d4;padding:13px;border-radius:12px;margin:4px 0}nav button.active,nav button:hover{background:#292447;color:#fff}main{margin-left:235px;padding:35px;max-width:1300px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.muted{color:#9ba5c7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:#171d34;border:1px solid #303751;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 30px #0002}.stat{font-size:32px;font-weight:800;color:#bba5ff}.primary{background:#825cf5;color:white;border:0;border-radius:10px;padding:11px 17px}.danger{background:#4c2637;color:#ffb6c4;border:0;border-radius:9px;padding:8px 12px}.ghost{background:#303752;color:white;border:0;border-radius:9px;padding:8px 12px}input,textarea,select{background:#0e1428;border:1px solid #424966;border-radius:10px;padding:11px;color:white;width:100%;margin:6px 0 12px}textarea{min-height:100px;resize:vertical}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #303751;padding:12px 0}.item:last-child{border:0}.item small{color:#9ba5c7}.actions{display:flex;gap:7px;flex-shrink:0}.day{border-left:3px solid #825cf5;padding-left:12px}.hidden{display:none!important}form{max-width:650px}.pill{background:#292447;color:#cdbbff;padding:5px 9px;border-radius:20px;font-size:12px}.check{width:auto;margin-right:8px}.empty{color:#9ba5c7;padding:20px 0}@media(max-width:720px){aside{position:static;width:100%;padding:15px}aside h1{margin:0 0 10px}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto}main{margin:0;padding:18px}.item{align-items:flex-start;flex-wrap:wrap}}
</style></head><body>
<aside><h1>✦ SkoleHub</h1><nav id="nav"></nav><p class="muted" style="font-size:12px;padding:14px">Dine data gemmes på denne enhed.</p></aside>
<main><header class="top"><div><p class="muted" id="today"></p><h2 id="heading">Overblik</h2></div><span class="pill">✨ Mit skole-dashboard</span></header><section id="view"></section></main>
<script>
const pages=[["home","🏠 Overblik"],["schedule","📅 Skema"],["homework","📚 Lektier"],["tasks","📝 Afleveringer"],["notes","📒 Noter"],["settings","⚙️ Indstillinger"]];
const key="skolehub-v1";let db;try{db=JSON.parse(localStorage.getItem(key))||{}}catch{db={}};for(const k of ["schedule","homework","tasks","notes"])if(!Array.isArray(db[k]))db[k]=[];
let page="home",editing=null;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const save=()=>localStorage.setItem(key,JSON.stringify(db));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const dayNames=["Mandag","Tirsdag","Onsdag","Torsdag","Fredag"];const now=new Date();$("today").textContent=now.toLocaleDateString("da-DK",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
function go(p){page=p;editing=null;render()}function render(){document.querySelector("#nav").innerHTML=pages.map(([p,t])=>'<button class="'+(p===page?"active":"")+'" data-page="'+p+'">'+t+'</button>').join("");document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));$("heading").textContent=pages.find(x=>x[0]===page)[1].slice(2);const v=$("view");if(page==="home")home(v);else if(page==="settings")settings(v);else collection(v,page)}
const counts=()=>db.tasks.filter(x=>!x.done).length;
function home(v){let today=dayNames[(now.getDay()+6)%7]||"Weekend";let lessons=db.schedule.filter(x=>x.day===today).sort((a,b)=>a.time.localeCompare(b.time));v.innerHTML='<div class="grid"><div class="card"><div class="muted">Lektier tilbage</div><div class="stat">'+db.homework.filter(x=>!x.done).length+'</div></div><div class="card"><div class="muted">Afleveringer tilbage</div><div class="stat">'+counts()+'</div></div><div class="card"><div class="muted">Noter</div><div class="stat">'+db.notes.length+'</div></div></div><div class="grid"><div class="card"><h3>Dagens skema · '+today+'</h3>'+(lessons.length?lessons.map(x=>'<div class="item"><span>'+esc(x.time)+' · '+esc(x.title)+'</span><small>'+esc(x.room)+'</small></div>').join(""):'<p class="empty">Ingen timer i dag</p>')+'</div><div class="card"><h3>Kommende afleveringer</h3>'+ (db.tasks.filter(x=>!x.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(x=>'<div class="item"><span>'+esc(x.title)+'</span><small>'+esc(x.date)+'</small></div>').join("")||'<p class="empty">Ingen afleveringer endnu</p>')+'</div></div>'}
const fields={schedule:[["title","Fag","text"],["day","Ugedag","day"],["time","Tidspunkt","time"],["room","Lokale","text"]],homework:[["title","Lektie","text"],["subject","Fag","text"],["date","Deadline","date"],["details","Beskrivelse","textarea"]],tasks:[["title","Aflevering","text"],["subject","Fag","text"],["date","Deadline","date"],["details","Beskrivelse","textarea"]],notes:[["title","Titel","text"],["subject","Fag","text"],["details","Notat","textarea"]]};
function collection(v,k){const names={schedule:"timer",homework:"lektier",tasks:"afleveringer",notes:"noter"};let items=[...db[k]];if(k==="schedule")items.sort((a,b)=>dayNames.indexOf(a.day)-dayNames.indexOf(b.day)||a.time.localeCompare(b.time));if(k==="tasks"||k==="homework")items.sort((a,b)=>(a.done-b.done)||(a.date||"").localeCompare(b.date||""));v.innerHTML='<div class="top"><p class="muted">'+items.length+' '+names[k]+'</p><button class="primary" id="add">+ Tilføj</button></div><div id="editor"></div><div class="card" id="entries">'+(items.length?items.map(x=>'<div class="item"><div>'+(k==="homework"||k==="tasks"?'<input class="check" type="checkbox" data-done="'+esc(x.id)+'" '+(x.done?"checked":"")+'>':"")+'<strong>'+esc(x.title)+'</strong><div><small>'+esc([x.subject,x.day,x.time,x.room,x.date].filter(Boolean).join(" · "))+'</small></div>'+(x.details?'<p class="muted">'+esc(x.details).replace(/\n/g,"<br>")+'</p>':"")+'</div><div class="actions"><button class="ghost" data-edit="'+esc(x.id)+'">Rediger</button><button class="danger" data-delete="'+esc(x.id)+'">Slet</button></div></div>').join(""):'<p class="empty">Ingen '+names[k]+' endnu. Tryk på Tilføj for at komme i gang.</p>')+'</div>';$("add").onclick=()=>edit(k,null);v.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(k,b.dataset.edit));v.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Vil du slette dette?")){db[k]=db[k].filter(x=>x.id!==b.dataset.delete);save();render()}});v.querySelectorAll("[data-done]").forEach(b=>b.onchange=()=>{db[k].find(x=>x.id===b.dataset.done).done=b.checked;save();render()});if(editing)edit(k,editing)}
function edit(k,id){editing=id||"new";const item=db[k].find(x=>x.id===id)||{};const form=fields[k].map(([name,label,type])=>'<label>'+label+(type==="textarea"?'<textarea name="'+name+'">'+esc(item[name])+'</textarea>':type==="day"?'<select name="day">'+dayNames.map(d=>'<option '+(item.day===d?"selected":"")+'>'+d+'</option>').join("")+'</select>':'<input name="'+name+'" type="'+type+'" value="'+esc(item[name])+'" '+(name==="title"?"required":"")+'>')+'</label>').join("");$("editor").innerHTML='<div class="card"><h3>'+(id&&id!=="new"?"Rediger":"Tilføj")+'</h3><form id="entryForm">'+form+'<button class="primary" type="submit">Gem</button> <button class="ghost" type="button" id="cancel">Annuller</button></form></div>';$("cancel").onclick=()=>{editing=null;render()};$("entryForm").onsubmit=e=>{e.preventDefault();const obj={...item,id:item.id||uid()};new FormData(e.target).forEach((v,k)=>obj[k]=v.toString().trim());if(!obj.title)return;if(item.id)Object.assign(db[k].find(x=>x.id===item.id),obj);else db[k].push(obj);save();editing=null;render()};$("editor").scrollIntoView({behavior:"smooth",block:"nearest"})}
function settings(v){v.innerHTML='<div class="card"><h3>Eksporter data</h3><p class="muted">Download en sikkerhedskopi af dit skema, dine lektier og noter som JSON.</p><button class="primary" id="export">Download sikkerhedskopi</button></div><div class="card"><h3>Importer data</h3><p class="muted">Vælg en tidligere eksporteret JSON-fil. Dette erstatter dine nuværende data.</p><input type="file" id="import" accept=".json,application/json"></div><div class="card"><h3>Nulstil dashboard</h3><button class="danger" id="reset">Slet alle lokale data</button></div>';$("export").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="skolehub-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$("import").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!["schedule","homework","tasks","notes"].every(k=>Array.isArray(x[k])))throw Error("Ugyldig fil");if(confirm("Erstat alle nuværende data?")){db=x;save();render()}}catch{alert("Kunne ikke læse backup-filen")}};$("reset").onclick=()=>{if(confirm("Slet alle data? Dette kan ikke fortrydes.")){db={schedule:[],homework:[],tasks:[],notes:[]};save();render()}}}
render();
</script></body></html>
